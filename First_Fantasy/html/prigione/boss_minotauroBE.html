<html lang="it">

            <div class="battaglia">

                            <img src="../../img/GUI/vita.png" class="vita" id="vita8_nemico">

                </div>

                <div class="GUI">
                    
                    <div class="triangolo_mosse">
                        <button class="bottone_mossa spada">
                            <img src="../../img/GUI/spada.png" class="azione">
                        </button>

                        <button class="bottone_mossa scudo">
                            <img src="../../img/GUI/scudo.png" class="azione">

                    <div id="textbox" class="text-box">
                        <p id="testo"></p>
                        <div class="button-box">
                            <a href="../endings/bad_ending.html" class="pulsante hidden">
                                <img src="../../img/buttons/bottone_rosso.png" class="immagine_bottone">
                                <h1>AVANZA</h1>
                            </a>
                        </div>
                    </div>

                </div>

                <div class="combattente">

                    <div class="immagine_combattente">
                        <img src="../../img/characters/eroe/eroe_battaglia.png">

                    <div class="vite">

            const dialogueText = document.getElementById("testo");
            const textBox = document.getElementById("textbox");
            const jsonPath = "../../txt/prigione/boss_minotauro.json";
            const dialoghiIniziali = 16;
